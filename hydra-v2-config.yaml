# Save as hydra-v2-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hydra-v2-config
  namespace: hydra-v2-prod
data:
  hydra.yml: |
    version: v1.11.0

    serve:
      public:
        port: 4444
        host: 0.0.0.0
        cors:
          enabled: true
          allowed_origins:
            - "*"
          allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          allowed_headers: [Authorization, Content-Type, Accept]
          exposed_headers: [Content-Type, Cache-Control]
          allow_credentials: true
          debug: true
          max_age: 86400
      admin:
        port: 4445
        host: 0.0.0.0
      cookies:
        same_site_mode: Lax
        same_site_legacy_workaround: true
        domain: ""
        paths:
          session: /
        secure: false

    urls:
      self:
        # ── MUST match the issuer claim our /.well-known/openid-configuration
        # advertises. Our v2 backend's discovery doc says
        # issuer = https://prod.api.authsec.ai (no path suffix), so v2 Hydra
        # uses the same. JWT iss claims will then match.
        issuer: https://prod.api.authsec.ai
        public: https://oauth-v2.prod.authsec.ai
      # ── UI redirect targets — our new v2 UI on app.authsec.ai
      consent: https://app.authsec.ai/oauth/consent
      login: https://app.authsec.ai/oauth/login
      logout: https://app.authsec.ai/oauth/logout

    oidc:
      subject_identifiers:
        supported_types: [pairwise, public]
      dynamic_client_registration:
        enabled: true   # ← MCP clients DCR. Legacy was false; v2 needs true.

    oauth2:
      expose_internal_errors: true
      hashers:
        bcrypt:
          cost: 12
      pkce:
        # ── MCP clients always use PKCE; enforce it.
        enforced: true
        enforced_for_public_clients: true
      session:
        encrypt_at_rest: true
      # ── Permissive audience: any client can request any audience. Avoids
      # the "Requested audience X has not been whitelisted" warning that
      # bit us on the existing Hydra.
      allowed_top_level_claims: [aud]

    webfinger:
      jwks:
        broadcast_keys:
          - hydra.openid.id-token
      oidc_discovery:
        client_registration_url: ""
        supported_claims: [sub, email, email_verified, name, family_name, given_name, picture]
        supported_scope: [offline, offline_access, openid, profile, email]

    log:
      level: info
      format: json
      leak_sensitive_values: false   # ← legacy had `true`, that's a leak source

    strategies:
      access_token: jwt
      scope: wildcard

    ttl:
      login_consent_request: 30m
      access_token: 1h
      refresh_token: 720h
      id_token: 1h
      auth_code: 10m

    hsm:
      enabled: false
