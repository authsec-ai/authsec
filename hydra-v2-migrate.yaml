# Save as hydra-v2-migrate.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: hydra-v2-migrate
  namespace: hydra-v2-prod
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: hydra-migrate
          image: oryd/hydra:v2.3.0
          args: ["migrate", "sql", "up", "-e", "--yes", "--config", "/etc/hydra/hydra.yml"]
          envFrom:
            - secretRef:
                name: hydra-v2-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/hydra
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hydra-v2-config
