name: Go CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: go-build-and-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: authsec
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authsec"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: authsec
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL_MODE: disable
      TOTP_ENCRYPTION_KEY: test-totp-key-for-ci-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The DB-gated suites SKIP unless their DSN env var is set -- so plain
      # `go test ./...` above prints ok while running none of them. That is
      # exactly how the Phase 2 evidence defect shipped once: the tests that
      # would have caught it never ran. These steps point the suites at the
      # postgres service so they actually execute on every PR.
      - name: Graph projection tests (self-migrating, isolated DB)
        # `go test ./...` above fails on known, unrelated tests. Those failures
        # must not hide this suite: it is the only place the graph catalog
        # guard and the projection tests run.
        if: success() || failure()
        env:
          # A DEDICATED database: the igagraph suite DROPs and rebuilds its
          # public schema from migrations, so it must never share the DB the
          # rest of go test uses.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/iga_graph_test?sslmode=disable
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d authsec \
            -c "DROP DATABASE IF EXISTS iga_graph_test WITH (FORCE);" \
            -c "CREATE DATABASE iga_graph_test;"
          go test ./tests/igagraph/... -count=1

      - name: Evidence path tests (real scanner -> real projector)
        if: success() || failure()
        env:
          IGA_TEST_DSN: postgres://postgres:postgres@localhost:5432/authsec?sslmode=disable
        run: |
          # The integration harness expects a migrated schema; apply every
          # migration in order, each file in one transaction (006 needs it).
          for f in migrations/master/0*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d authsec \
              -v ON_ERROR_STOP=1 -1 -f "$f" >/dev/null
          done
          # The two qualified-subject evidence tests, plus the TRD2 integration
          # proofs (mixed sources, fencing, flag-off golden, migration-on-data).
          # The rest of the suite stays in the opt-in job in pr-checks.yml,
          # which carries one known-failing, unrelated checkpoint test.
          go test ./tests/integration/ -count=1 -timeout 30m \
            -run 'TestPermissionEvidenceSubjectKeyIsQualified|TestObservationDedupeUpgradesUnqualifiedKey|TestTRD2IT|TestTRD2ITA5'
