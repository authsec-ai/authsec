name: Go CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: go-build-and-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: authsec
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authsec"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: authsec
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL_MODE: disable
      TOTP_ENCRYPTION_KEY: test-totp-key-for-ci-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
