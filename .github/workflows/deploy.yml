name: Deploy

# Build, push, deploy and VERIFY.
#
# Before this existed a push deployed nothing, and that was not a broken
# pipeline -- there was no pipeline. go-ci and mirror fire only on `main`,
# pr-checks fires only on a pull_request, and nothing in the cluster watches a
# registry. Code could sit pushed and untested for days while production served
# a month-old binary.
#
# Two rules this workflow exists to enforce, both learned from how the previous
# setup failed silently:
#
#   1. IMAGES ARE TAGGED WITH THE COMMIT. Deployments referenced a floating
#      `:production` tag, so the tag identified no commit AND a rollout to the
#      same tag was a no-op -- Kubernetes sees no diff and keeps the cached
#      image. You could build, push, "deploy", and still be running yesterday's
#      binary.
#   2. THE DEPLOY IS NOT DONE UNTIL IT IS VERIFIED. The last step asks the
#      running service which commit it is, and fails the job if the answer is
#      not this one. A green deploy job that deployed nothing is worse than a
#      red one.

on:
  push:
    branches:
      - authsec-staging
  # Deliberately available by hand as well: a re-deploy of an unchanged commit
  # (a rolled-back node, a restored database) is a normal thing to need, and
  # pushing an empty commit to get it is a bad habit to force.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: docker-repo-public.authnull.com
  IMAGE: authsec
  NAMESPACE: authsec-prod
  DEPLOYMENT: prod-authsec
  CONTAINER: prod-authsec
  API: https://prod.api.authsec.ai

jobs:
  # ── Gate: never deploy a red build ─────────────────────────────────────────
  #
  # pr-checks only runs on pull requests, so a direct push to this branch has
  # had nothing run against it. Re-running the cheap checks here is the
  # difference between "deploys on push" and "deploys whatever was pushed".
  verify-source:
    name: Tests and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Configure private module access
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: git config --global url."https://${TOKEN}@github.com/".insteadOf "https://github.com/"

      - run: go mod download
      - run: go vet ./...
      - name: Migration hygiene
        run: ./scripts/ci-migration-check.sh
      - name: IGA isolation
        run: ./scripts/ci-iga-isolation-check.sh
      - name: Unit tests
        run: go test -short ./tests/unit/ ./internal/... ./models/...

  build:
    name: Build and push image
    needs: verify-source
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY'
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v6

      - id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # ONLY the SHA tag. `:production` is moved by the deploy job AFTER
          # verification passes, so that tag means "last build proven to work"
          # instead of "last build attempted".
          #
          # Tagging :production here caused two failures at once. Rollback
          # reverts to the previous ReplicaSet, which references :production --
          # so overwriting it made `rollout undo` land on the NEW image and
          # report a successful rollback that changed nothing. And any pod
          # restart (node reboot, eviction) pulled untested code, which is how
          # production silently moved forward twice without a deploy.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}

  deploy:
    name: Deploy and verify
    needs: build
    runs-on: ubuntu-latest
    # A GitHub Environment, so a required reviewer can be attached in repo
    # settings WITHOUT editing this file. There is one cluster and it serves
    # customers; whether a push should reach it unattended is a decision for a
    # person, and this is where that decision is expressed.
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Set up cluster access
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "${KUBECONFIG_B64:-}" ]; then
            echo "::error::KUBECONFIG_B64 is not set. Mint it with scripts/make-deployer-kubeconfig.sh"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          # `kubectl version --client` passes with NO kubeconfig at all, so it
          # proves nothing -- an empty secret sailed through this step and the
          # job died later, in the database backup, looking like a backup bug.
          # Reach the API and assert the one permission this job needs.
          kubectl auth can-i patch deployments -n "$NAMESPACE"

      # Migrations run on boot, against a database with customers in it. A
      # backup taken AFTER the new pods start is a backup of the migrated
      # schema, which is not what a rollback needs.
      - name: Back up the database before migrating
        run: |
          kubectl exec -n database-prod postgresql-primary-0 -- \
            env AUTHSEC_RELEASE="${{ needs.build.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            sh -ec '
              umask 077
              backup_dir=/bitnami/postgresql/authsec-release-backups
              mkdir -p "$backup_dir"
              backup="$backup_dir/authprod-$AUTHSEC_RELEASE.dump"
              export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"
              pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DATABASE" -Fc > "$backup"
              test -s "$backup"
              pg_restore --list "$backup" > /dev/null
              sha256sum "$backup"
            '
          # This directory is on the verified PostgreSQL PVC. Customer data
          # stays in the cluster; never upload this dump to Actions artifacts.
          # This pre-release copy is not a substitute for off-cluster backups.

      # Rollback needs a target that a later push cannot move. The Deployment
      # spec holds a TAG, and `kubectl rollout undo` restores that tag -- so if
      # the tag has since been repointed, "rollback" lands on the new image and
      # reports success having changed nothing. A digest cannot be repointed.
      - name: Record the running image digest
        id: current
        run: |
          sel="$(kubectl get deploy -n "$NAMESPACE" "$DEPLOYMENT" -o json \
            | jq -r '.spec.selector.matchLabels | to_entries
                     | map("\(.key)=\(.value)") | join(",")')"
          digest="$(kubectl get pods -n "$NAMESPACE" -l "$sel" -o json \
            | jq -r --arg c "$CONTAINER" '[.items[].status.containerStatuses[]?
                     | select(.name == $c) | .imageID]
                     | map(select(. != null and . != "")) | first // ""')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ -n "$digest" ]; then
            echo "Currently running: $digest"
          else
            echo "::warning::No running pod found -- rollback will be unavailable."
          fi

      - name: Point the deployment at this commit
        id: rollout
        run: |
          kubectl set image -n "$NAMESPACE" \
            "deploy/$DEPLOYMENT" \
            "$CONTAINER=$REGISTRY/$IMAGE:${{ needs.build.outputs.sha }}"
          echo "image_updated=true" >> "$GITHUB_OUTPUT"
          kubectl annotate -n "$NAMESPACE" "deploy/$DEPLOYMENT" \
            kubernetes.io/change-cause="deploy ${{ needs.build.outputs.sha }} by ${{ github.actor }}" \
            --overwrite
          kubectl rollout status -n "$NAMESPACE" "deploy/$DEPLOYMENT" --timeout=5m

      # The step that makes this a deploy rather than a hope. It polls rather
      # than asking once -- see the header of the script.
      - name: Verify the running commit
        id: verify
        run: API="$API" ./scripts/check-deployed-version.sh "${{ needs.build.outputs.sha }}"

      # Only now does :production move. The tag therefore always names a build
      # that answered its own version endpoint correctly, so a pod restarting
      # for any reason comes back on known-good code.
      - name: Promote :production to the verified image
        # A registry hiccup here must not tear down a deploy that just proved
        # itself. The tag lagging is a cosmetic problem; rolling back working
        # code because a re-tag failed is not.
        continue-on-error: true
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" \
            | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          docker buildx imagetools create \
            --tag "$REGISTRY/$IMAGE:production" \
            "$REGISTRY/$IMAGE:${{ needs.build.outputs.sha }}"
          echo ":production now points at ${{ needs.build.outputs.sha }}"

      - name: Roll back if verification failed
        # `failure()` is required for this step to run at all -- without a
        # status function GitHub implicitly ANDs the condition with success().
        # The outcome check then narrows it to VERIFY having been the failure,
        # so a later step breaking cannot roll back a proven-good deploy.
        if: failure() && steps.verify.outcome == 'failure' && steps.rollout.outputs.image_updated == 'true'
        run: |
          digest='${{ steps.current.outputs.digest }}'
          if [ -z "$digest" ]; then
            echo "::error::Verification failed and no previous digest was recorded."
            echo "The new image is still live. Roll back by hand:"
            echo "  kubectl rollout undo -n $NAMESPACE deploy/$DEPLOYMENT"
            exit 1
          fi
          echo "Verification failed — rolling back to $digest"
          # By digest, not `rollout undo`: undo restores the previous spec's
          # TAG, and a tag can have been repointed since. This cannot.
          kubectl set image -n "$NAMESPACE" "deploy/$DEPLOYMENT" "$CONTAINER=$digest"
          kubectl annotate -n "$NAMESPACE" "deploy/$DEPLOYMENT" \
            kubernetes.io/change-cause="rollback from ${{ needs.build.outputs.sha }} (verification failed)" \
            --overwrite
          kubectl rollout status -n "$NAMESPACE" "deploy/$DEPLOYMENT" --timeout=5m

          # Prove the rollback rather than trusting it -- this is the exact
          # failure the digest is here to prevent, so assert it landed.
          now="$(kubectl get pods -n "$NAMESPACE" \
            -l "$(kubectl get deploy -n "$NAMESPACE" "$DEPLOYMENT" -o json \
                  | jq -r '.spec.selector.matchLabels | to_entries
                           | map("\(.key)=\(.value)") | join(",")')" -o json \
            | jq -r --arg c "$CONTAINER" '[.items[].status.containerStatuses[]?
                     | select(.name == $c) | .imageID] | first // ""')"
          if [ "$now" != "$digest" ]; then
            echo "::error::Rollback did not land. Running $now, expected $digest."
            exit 1
          fi
          echo "Rollback confirmed. The database backup remains on the PostgreSQL PVC."
          echo "::warning::Migrations from this release were NOT reverted."
