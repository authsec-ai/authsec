name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, authsec-dev, authsec-staging, authsec-prod]

env:
  GOPRIVATE: github.com/authsec-ai/*
  GONOSUMDB: github.com/authsec-ai/*
  GONOPROXY: github.com/authsec-ai/*

jobs:
  # ── Unit tests (always run, no DB required) ─────────────────────────────────
  migration-hygiene:
    name: Migration hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No duplicate or self-transacting migrations
        run: ./scripts/ci-migration-check.sh

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Configure private module access
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: git config --global url."https://${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -short -race ./tests/unit/ -v

  # ── Merge gate — always passes unless integration tests ran and failed ───────
  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, migration-hygiene]
    if: always()
    steps:
      - name: Unit tests must pass
        if: needs.unit-tests.result != 'success'
        run: |
          echo "Unit tests failed or were cancelled — merge blocked"
          exit 1
      - name: Migration hygiene must pass
        if: needs.migration-hygiene.result != 'success'
        run: |
          echo "Migration hygiene failed — merge blocked"
          exit 1
      - name: All checks passed
        run: echo "All required checks passed"

  # ── Integration tests (opt-in via PR label "run-integration") ──────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-integration')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authsec
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: authsec
      DB_SSLMODE: disable
      RUN_INTEGRATION: "1"
      # Without this the whole tests/integration suite SKIPS (igaDB checks it)
      # and `go test` prints ok while running nothing -- the exact trap the
      # Phase 2 review flagged. Point it at the migrated service DB below.
      IGA_TEST_DSN: postgres://postgres:postgres@localhost:5432/authsec?sslmode=disable

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Configure private module access
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: git config --global url."https://${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      # The integration harness (igaDB) expects the schema to already exist --
      # it inserts into workspaces/cloud_* rather than building them. Apply
      # every migration in order, each file in its own transaction because 006
      # uses CREATE TEMP TABLE ... ON COMMIT DROP.
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in migrations/master/0*.sql; do
            psql -h localhost -U postgres -d authsec -v ON_ERROR_STOP=1 -1 -f "$f" >/dev/null
          done

      - name: Integration tests
        # NOTE: TestIGACheckpointsAndSurvivorship is a known pre-existing
        # failure in the scan-checkpoint path, unrelated to the graph work.
        # This job is opt-in (run-integration label) and NOT part of the merge
        # gate, so that failure surfaces here without blocking merges.
        run: go test ./tests/unit/ ./tests/integration/... -v -timeout 120s
