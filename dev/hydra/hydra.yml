dsn: postgres://postgres:postgres@postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4

serve:
  public:
    host: 0.0.0.0
    port: 4444
  admin:
    host: 0.0.0.0
    port: 4445
  cookies:
    same_site_mode: Lax

urls:
  self:
    issuer: http://localhost:4444/
  login: http://localhost:7468/authsec/hmgr/login
  consent: http://localhost:7468/authsec/hmgr/consent
  logout: http://localhost:7468/authsec/hmgr/login

secrets:
  system:
    - hydra-local-system-secret-hydra-local-system-secret
  cookie:
    - hydra-local-cookie-secret-hydra-local-cookie-secret

oidc:
  subject_identifiers:
    supported_types:
      - public
      - pairwise
    pairwise:
      salt: hydra-local-pairwise-salt

ttl:
  access_token: 1h
  refresh_token: 720h
  id_token: 1h
  auth_code: 10m

strategies:
  access_token: jwt

log:
  level: info
